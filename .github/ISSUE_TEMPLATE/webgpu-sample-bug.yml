name: WebGPU Sample Bug
description: Report a rendering issue, crash, or failure in one of the live WebGPU samples.
title: "[WebGPU Sample] "
labels: ["bug", "webgpu-sample"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue with the WebGPU samples.
        Please fill in as much detail as possible — browser version and GPU are especially important.

  - type: dropdown
    id: sample
    attributes:
      label: Sample name
      description: Which sample is affected?
      options:
        - Window (00_window)
        - Triangle (01_triangle)
        - Cube (02_cube)
        - Two Cubes (03_two_cubes)
        - Fractal Cube (04_fractal_cube)
        - MSAA (05_msaa)
        - Instancing (06_instancing)
        - ImGui Overlay (07_imgui_overlay)
        - ImGui Panel (08_imgui_panel)
        - Texturing (09_texturing)
        - Sampler Parameters (10_sampler_parameters)
        - Texture Mipmap (11_texture_mipmap)
        - Cubemap (12_cubemap)
        - Lighting (13_lighting)
        - Camera Controller (14_camera_controller)
        - Teapot (15_teapot)
        - Compute (16_compute)
        - Compute to Render (17_compute_to_render)
        - Metaballs (18_metaballs)
        - Teapot Normals (19_teapot_normals)
        - Wireframe (20_wireframe)
        - PBR Material (21_pbr_material)
        - Normal Mapping (22_normal_mapping)
        - Environment Mapping (23_environment_mapping)
        - Reflection (24_reflection)
        - HDR & Tone Mapping (25_hdr)
        - Shadow Mapping (26_shadow_mapping)
        - Depth Precision (27_depth_precision)
        - Stencil Testing (28_stencil_testing)
        - Blending (29_blending)
        - Deferred Shading (30_deferred_shading)
        - OIT — A-Buffer (31_oit_abuffer)
        - OIT — Dual Depth Peeling (32_oit_dual_depth_peeling)
        - OIT — Weighted Blended (33_oit_weighted_blended)
        - Line Rendering (34_line_rendering)
        - Point Rendering (35_point_rendering)
        - Text Rendering (36_text_rendering)
        - GPU Picking (37_picking)
        - Volume Rendering (38_volume_rendering)
        - Volume Windowing (39_volume_windowing)
        - Slice Rendering (40_slice_rendering)
        - GPU Debug (41_gpu_debug)
        - glTF Viewer (42_gltf_viewer)
        - USD Viewer (43_usd_viewer)
        - Push Constants (44_push_constants)
        - Multithreading (45_multithreading)
        - Multithreaded Picking (46_multithreaded_picking)
        - Offscreen Worker (47_offscreen_worker)
        - Render Bundles (48_render_bundles)
        - Multiple samples
        - All samples
    validations:
      required: true

  - type: dropdown
    id: issue_type
    attributes:
      label: Issue type
      options:
        - Sample fails to load / blank screen
        - Sample crashes or throws an error
        - Incorrect rendering / visual artifact
        - Performance issue (very slow / unresponsive)
        - Controls or interaction not working
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem clearly. What did you see vs. what you expected?
      placeholder: |
        The triangle sample loads but the canvas stays black. No error in the console.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce the issue?
      value: |
        1. Open https://vertexnova.github.io/
        2. Click "..."
        3. ...
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Please fill in all fields you can.
      value: |
        - Browser name and version:
        - Operating system:
        - GPU (make and model if known):
        - GPU driver version (optional):
        - Device type: Desktop / Laptop / Mobile / Tablet
    validations:
      required: true

  - type: textarea
    id: console_output
    attributes:
      label: Browser console output
      description: |
        Open the browser developer tools (F12), go to the Console tab,
        and paste any errors or warnings here.
      render: text
      placeholder: Paste console output here (or "no errors")

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Screenshots, screen recordings, or any other relevant information.
